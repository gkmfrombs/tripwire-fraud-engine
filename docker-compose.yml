# TRIPWIRE Phase 1: object storage + metadata DB + experiment tracking.
# All ports bind to 127.0.0.1 only; nothing is exposed to your network.
name: tripwire

services:
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.42}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # S3 credentials are rendered from .env at start-up, so no secret file lives in git.
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"tripwire","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed mini -dir=/data -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:9333:9333"   # cluster status UI
    volumes:
      - seaweed-data:/data

  # One-shot job: waits for the store, then creates the buckets this project uses.
  seaweedfs-init:
    image: amazon/aws-cli:2.17.0
    depends_on: [seaweedfs]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    command:
      - |
        for b in mlflow-artifacts dvc-storage; do
          n=0
          until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$b 2>/dev/null \
             || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$b 2>/dev/null; do
            n=$$((n+1)); [ $$n -gt 60 ] && echo "gave up on bucket $$b" && exit 1
            echo "waiting for object store ($$b)..."; sleep 2
          done
          echo "bucket ready: $$b"
        done

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Clients talk only to MLflow; MLflow alone holds the storage credentials
  # (proxied artifact access), exactly as a production tracking server would.
  mlflow:
    build:
      context: ./infra/mlflow
    image: tripwire/mlflow:3.17.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination s3://mlflow-artifacts
      --allowed-hosts localhost:5000,127.0.0.1:5000,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  seaweed-data:
  postgres-data:
